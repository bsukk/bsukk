<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>biboy</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url('https://i.pinimg.com/1200x/d7/54/a1/d754a1cab66d2bf79d155acf8849e68d.jpg') center center/cover no-repeat;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(4px);
}

.profile{
    position:relative;
    z-index:2;
    text-align:center;
    color:white;
}

.banner{
    width:320px;
    height:120px;
    border-radius:18px;
    background:url('https://i.pinimg.com/736x/36/e3/e8/36e3e86d0c4de1a772e1f1b752d820ab.jpg') center/cover;
    box-shadow:0 0 30px rgba(0,0,0,.4);
}

.avatar{
    width:95px;
    height:95px;
    border-radius:50%;
    border:5px solid #111;
    margin:-48px auto 15px;
    display:block;
    object-fit:cover;
}

.name{
    font-size:2rem;
    font-weight:700;
}

.username{
    opacity:.7;
    margin-top:5px;
}

.bio{
    margin-top:10px;
    font-size:1.1rem;
}

.socials{
    margin-top:15px;
}

.socials a{
    color:white;
    text-decoration:none;
    font-size:28px;
    margin:0 10px;
}

#discord-presence{
    margin-top:10px;
    font-size:1rem;
    opacity:0.85;
}
</style>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<audio id="bgMusic" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="profile">

    <div class="banner"></div>

    <img class="avatar" src="https://i.pinimg.com/736x/71/8b/e0/718be04d19d6ffb41853d21e26ce9f8a.jpg">

    <div class="name">biboy</div>

    <div class="username">@ب</div>

    <div class="bio">stackz , aknem , xorev</div>

    <!-- DISCORD STATUS SHOWS HERE -->
    <div id="discord-presence">Loading Discord status...</div>

    <div class="socials">
        <a href="https://discord.gg/yztwAAgV" target="_blank">
            <i class="fab fa-discord"></i>
        </a>
    </div>

</div>

<!-- DISCORD PRESENCE SCRIPT -->
<script>
const userId = "1254550540562468914";

async function updateDiscordPresence() {
    try {
        const response = await fetch(https://api.lanyard.rest/v1/users/${userId});
        const json = await response.json();
        const data = json.data;

        let text = "";

        switch (data.discord_status) {
            case "online":
                text = "🟢 Online";
                break;
            case "idle":
                text = "🌙 Idle";
                break;
            case "dnd":
                text = "⛔ Do Not Disturb";
                break;
            default:
                text = "⚫ Offline";
        }

        const game = data.activities.find(a => a.type === 0);

        if (game) {
            text += <br>🎮 Playing ${game.name};
        }

        if (data.listening_to_spotify) {
            text += <br>🎵 Listening to ${data.spotify.song} - ${data.spotify.artist};
        }

        document.getElementById("discord-presence").innerHTML = text;

    } catch (err) {
        document.getElementById("discord-presence").textContent =
            "Discord status unavailable";
    }
}

updateDiscordPresence();
setInterval(updateDiscordPresence, 15000);
</script>

</body>
</html>
